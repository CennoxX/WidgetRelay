apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    compileSdk 37
    defaultConfig {
        applicationId "com.cennoxx.widgetrelay"
        // The plugin actions need the overlay permission, which is API 23+
        minSdkVersion 23
        targetSdkVersion 37
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // No signingConfig: configure your own keystore to publish a release
        }
    }
    compileOptions {
        sourceCompatibility 21
        targetCompatibility 21
    }
    namespace 'com.cennoxx.widgetrelay'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.activity:activity-ktx:1.8.0'
    implementation 'androidx.core:core-ktx:1.12.0'

    implementation project(':taskerpluginlibrary')
}

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// Optional release signing. Create keystore.properties in the project root
// (see README) to sign release builds; without it assembleRelease still works
// but produces an unsigned APK. The file holds passwords and is gitignored.
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    compileSdk 37
    defaultConfig {
        applicationId "com.cennoxx.widgetrelay"
        // The plugin actions need the overlay permission, which is API 23+
        minSdkVersion 23
        targetSdkVersion 37
        versionCode 2
        versionName "2.0"
        // Default build-config flag (can be overridden per-flavor)
        buildConfigField "boolean", "IS_FULL_BUILD", "false"
    }
    flavorDimensions "tier"
    productFlavors {
        freemium {
            dimension "tier"
            // freemium behaves normally (not full)
            buildConfigField "boolean", "IS_FULL_BUILD", "false"
        }
        full {
            dimension "tier"
            // Full build: act as if premium / no freemium restrictions
            buildConfigField "boolean", "IS_FULL_BUILD", "true"
            // Optionally give full its own application id suffix if needed
            // applicationIdSuffix ".full"
        }
    }
    signingConfigs {
        if (keystorePropertiesFile.exists()) {
            release {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility 21
        targetCompatibility 21
    }
    namespace 'com.cennoxx.widgetrelay'

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.activity:activity-ktx:1.8.0'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'com.android.billingclient:billing:9.1.0'

    implementation project(':taskerpluginlibrary')

    testImplementation 'junit:junit:4.13.2'
}
